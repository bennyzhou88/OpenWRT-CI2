#CI项目：把上游 VIKINGYFY/OpenWRT-CI 合并到 main（私有工作流，上游没有此文件）
#只能手动运行：fork 仓库里有定时任务会被 GitHub 整体禁用
name: Sync-Upstream

on:
  #手动同步
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          #上游提交常会修改 .github/workflows，GITHUB_TOKEN 无权推送这类改动，需要带 workflow 权限的 SYNC_TOKEN
          token: ${{secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN}}

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已经是上游最新，无需同步"
            exit 0
          fi

          git merge upstream/main -X theirs --no-edit -m "同步上游 VIKINGYFY/OpenWRT-CI"

          #上游的工作流带有定时任务和“清理后自动编译”，合并后再去掉，只保留手动触发
          python3 -I .github/scripts/strip-auto-triggers.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "去掉上游带来的自动触发，只保留手动触发"
          fi

          git push origin HEAD:main
